<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro</h1>
    </header>

    <main>
        <form action="#" method="post">

            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" tabindex="1">
            </div>

            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="Ej: correo@ejemplo.com" tabindex="2">
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres" minlength="8" tabindex="3">
            </div>

            <fieldset>
                <legend>Género</legend>
                <input type="radio" id="genero-masculino" name="genero" value="masculino" tabindex="4">
                <label for="genero-masculino">Masculino</label>

                <input type="radio" id="genero-femenino" name="genero" value="femenino" tabindex="5">
                <label for="genero-femenino">Femenino</label>

                <input type="radio" id="genero-otro" name="genero" value="otro" tabindex="6">
                <label for="genero-otro">Otro</label>
            </fieldset>

            <fieldset>
                <legend>Intereses</legend>
                <input type="checkbox" id="interes-musica" name="intereses" value="musica" tabindex="7">
                <label for="interes-musica">Música</label>

                <input type="checkbox" id="interes-deporte" name="intereses" value="deporte" tabindex="8">
                <label for="interes-deporte">Deporte</label>

                <input type="checkbox" id="interes-lectura" name="intereses" value="lectura" tabindex="9">
                <label for="interes-lectura">Lectura</label>

                <input type="checkbox" id="interes-tecnologia" name="intereses" value="tecnologia" tabindex="10">
                <label for="interes-tecnologia">Tecnología</label>
            </fieldset>

            <div>
                <label for="comentarios">Comentarios adicionales</label><br>
                <textarea id="comentarios" name="comentarios" placeholder="Escribí aquí tus comentarios..." rows="4" tabindex="11"></textarea>
            </div>

            <div>
                <label for="pais">País</label>
                <select id="pais" name="pais" required tabindex="12">
                    <option value="">Seleccione un país</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>

            <div>
                <button type="submit" tabindex="13">Registrarse</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Bruno Tello</p>
    </footer>

</body>
</html>
